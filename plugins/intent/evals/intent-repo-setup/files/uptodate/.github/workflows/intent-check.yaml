# Checks every intent.md a push changes with the intent plugin's gate script and reports the result in the run
# summary (information only). If the push changed a locked intent, it comments on the intent's issue and fails, so the
# edit shows as a red check: planning uses the locked version. It can't block the push.
#
# The lock check reads the-marmack/intents and comments with the board App, whose client id and key are this repo's
# INTENT_LOCK_CLIENT_ID and INTENT_LOCK_PRIVATE_KEY secrets.
#
# skills-ref pins the gate script's source (the-marmack/skills) to a commit; /intent-repo-setup keeps this file
# current.
name: Intent Check

on:
  push:
    branches: [main]
    paths: ["intents/**"]

permissions:
  contents: read

jobs:
  check:
    uses: the-marmack/github-workflows/.github/workflows/intent-check.yaml@1c510275c6c1ad5f1df507cea8e770d086a0e150 # v6.6.0
    with:
      skills-ref: 0b3a43c5dffb9967723fa29313e31512c070482c # main
    secrets:
      app-client-id: ${{ secrets.INTENT_LOCK_CLIENT_ID }}
      app-private-key: ${{ secrets.INTENT_LOCK_PRIVATE_KEY }}

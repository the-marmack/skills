# Checks every intent.md a push changes with the intent plugin's gate script and reports the result in the run
# summary. Information only: it never blocks a push. Planning runs the same gate before it locks an intent.
#
# skills-ref pins the gate script's source (the-marmack/skills) to a commit; /intent-repo-setup keeps this file
# current.
name: Intent Check

on:
  push:
    branches: [main]
    paths: ["intents/**"]

permissions:
  contents: read

jobs:
  check:
    uses: the-marmack/github-workflows/.github/workflows/intent-check.yaml@1ef12e51af43012462ff633fd8c7fc186c645cc9 # v6.5.0
    with:
      skills-ref: 0b3a43c5dffb9967723fa29313e31512c070482c # main
